<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>스터디캠</title>
<style>
  :root { --bg:#141414; --fg:#f2f2f2; --dim:#9a9a9a; --accent:#4f8cff; --ok:#3fbf6f; --warn:#e0a13f; --bad:#e05f4f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:12px; }
  h1 { font-size:18px; margin:6px 0 12px; }
  .card { background:#1e1e1e; border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--dim); margin:10px 0 4px; }
  input[type=text],input[type=password],select { width:100%; padding:10px; border-radius:8px; border:1px solid #333; background:#111; color:var(--fg); font-size:14px; }
  button { padding:12px 16px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-size:15px; font-weight:600; }
  button.ghost { background:#2c2c2c; color:var(--fg); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .status { font-size:14px; line-height:1.6; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .dim { color:var(--dim); }
  #camBox { position:relative; width:100%; background:#000; border-radius:12px; overflow:hidden; }
  #video { width:100%; display:block; }
  #grid { position:absolute; inset:0; pointer-events:none; }
  #grid div { position:absolute; border:2px dashed rgba(79,140,255,.8); border-radius:6px; display:flex; align-items:flex-start; justify-content:flex-start; }
  #grid span { background:rgba(79,140,255,.85); color:#fff; font-size:12px; font-weight:700; padding:2px 6px; border-radius:0 0 6px 0; }
  #banner { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:var(--ok); color:#04170c; font-weight:700; padding:10px 18px; border-radius:999px; display:none; z-index:10; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .12s; z-index:9; }
  ul { padding-left:18px; font-size:14px; }
  .hidden { display:none !important; }
  .small { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<div id="flash"></div>
<div id="banner">촬영 완료</div>
<div class="wrap">

  <h1>스터디캠 <span class="small">시험교재</span></h1>

  <!-- 설정 -->
  <div class="card" id="settingsCard">
    <div class="status">서버 연결 설정 <span class="small">(최초 1회)</span></div>
    <label>Apps Script 주소</label>
    <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <label>토큰</label>
    <input type="password" id="cfgToken" placeholder="서버 코드의 TOKEN과 동일하게">
    <label>촬영 모드</label>
    <select id="cfgMode">
      <option value="4" selected>4쪽 모아 찍기</option>
      <option value="2">2쪽씩</option>
      <option value="1">1쪽씩</option>
    </select>
    <label>카메라</label>
    <select id="cfgCam">
      <option value="user" selected>전면 카메라</option>
      <option value="environment">후면 카메라</option>
    </select>
    <label>알림 소리</label>
    <select id="cfgSound"><option value="on" selected>켜기</option><option value="off">끄기</option></select>
    <label>민감도 (작을수록 쉽게 촬영)</label>
    <select id="cfgSens">
      <option value="1.4">둔감</option>
      <option value="1.0" selected>보통</option>
      <option value="0.7">민감</option>
    </select>
    <div class="row">
      <button id="btnSave">저장하고 시작</button>
      <button class="ghost" id="btnPing">연결 확인</button>
      <span class="status" id="pingResult"></span>
    </div>
  </div>

  <!-- 촬영 -->
  <div class="card hidden" id="camCard">
    <div id="camBox">
      <video id="video" autoplay playsinline muted></video>
      <div id="grid"></div>
    </div>
    <div class="row" style="align-items:center">
      <span class="status" id="camStatus">준비 중…</span>
      <button class="ghost hidden" id="btnCamRetry">카메라 다시 시도</button>
    </div>
    <div class="row"><span class="small dim" id="camDiag"></span></div>
    <div class="row">
      <span class="status dim" id="queueInfo">대기 0건 · 완료 0쪽</span>
      <button class="ghost" id="btnRefresh">상태 새로고침</button>
      <button class="ghost" id="btnClearQ">대기열 비우기</button>
      <button class="ghost" id="btnStop">일시정지</button>
    </div>
    <div class="row"><span class="small">사용법: 교재를 펼쳐 카메라 아래에 놓고 가만히 비추세요. 화면이 안정되면 자동으로 찍히고 소리가 납니다. 그다음 장을 넘기세요. 버튼을 누를 필요가 없습니다.</span></div>
  </div>

  <!-- 검토 필요 -->
  <div class="card hidden" id="reviewCard">
    <div class="status warn">검토 필요한 쪽</div>
    <ul id="reviewList"></ul>
  </div>

  <!-- 테스트 모드 (?test=1): 카메라 대신 이미지 파일로 시험 -->
  <div class="card hidden" id="testCard">
    <div class="status">테스트 모드</div>
    <input type="file" id="testFile" accept="image/*">
    <div class="row"><button class="ghost" id="btnTestRun">이 파일로 촬영 흐름 시험</button></div>
    <div class="status small" id="testLog"></div>
  </div>

</div>

<script>
'use strict';
/* ================= 설정 ================= */
const LS = { get:(k,d)=>{try{const v=localStorage.getItem('sc_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
             set:(k,v)=>{try{localStorage.setItem('sc_'+k,JSON.stringify(v));}catch(e){}} };
const cfg = {
  url: LS.get('url',''), token: LS.get('token',''),
  mode: parseInt(LS.get('mode',4),10), sound: LS.get('sound','on'),
  sens: parseFloat(LS.get('sens',1.0)), cam: LS.get('cam','user')
};
const TEST = new URLSearchParams(location.search).has('test');
if (TEST) document.getElementById('testCard').classList.remove('hidden');

/* 시작 링크(?url=...&token=...)로 설정을 자동 저장하고 주소를 정리 */
(function(){
  const q=new URLSearchParams(location.search);
  const u=q.get('url'), t=q.get('token');
  if(u&&t){ LS.set('url',u); LS.set('token',t); cfg.url=u; cfg.token=t;
    location.replace(location.pathname); }
})();

/* ================= 상태 ================= */
let stream=null, paused=false, capturing=false;
let pageSeq = LS.get('seq', 0);
let doneCount = 0;
let lastThumb = null, stableCount = 0, sawTurn = true;
const THUMB_W = 96;

/* ================= 소리 ================= */
let actx=null;
function beep(){
  if(cfg.sound!=='on') return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value=1320;
    g.gain.setValueAtTime(0.18, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.18);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+0.2);
  }catch(e){}
}
function flash(msg, ok=true){
  const f=document.getElementById('flash');
  f.style.opacity='0.7'; setTimeout(()=>f.style.opacity='0',150);
  const b=document.getElementById('banner');
  b.textContent=msg; b.style.background= ok? 'var(--ok)' : 'var(--warn)';
  b.style.display='block'; setTimeout(()=>b.style.display='none',1600);
}

/* ================= IndexedDB 대기열 ================= */
let db=null;
function dbOpen(){ return new Promise((res,rej)=>{
  const r=indexedDB.open('studycam',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('queue',{keyPath:'pageId'});
  r.onsuccess=()=>{db=r.result;res();}; r.onerror=()=>rej(r.error);
});}
function dbPut(item){ return new Promise((res,rej)=>{ if(!db) return res();
  const t=db.transaction('queue','readwrite'); t.objectStore('queue').put(item);
  t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });}
function dbDel(id){ return new Promise((res,rej)=>{ if(!db) return res();
  const t=db.transaction('queue','readwrite'); t.objectStore('queue').delete(id);
  t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });}
function dbAll(){ return new Promise((res,rej)=>{ if(!db) return res([]);
  const r=db.transaction('queue').objectStore('queue').getAll();
  r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });}

/* ================= 썸네일 차이(안정 감지) ================= */
const tCanvas=document.createElement('canvas'), tCtx=tCanvas.getContext('2d',{willReadFrequently:true});
function grabThumb(src){
  const w=THUMB_W, h=Math.max(1,Math.round(w*(src.videoHeight||src.height)/(src.videoWidth||src.width)));
  tCanvas.width=w; tCanvas.height=h;
  tCtx.drawImage(src,0,0,w,h);
  return tCtx.getImageData(0,0,w,h).data;
}
function meanLuma(data){
  let s=0,n=0;
  for(let i=0;i<data.length;i+=4){ s+=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2]; n++; }
  return n? s/n : 999;
}
const DARK_LUMA=20;
let camCount=0, diagBase='';
function updateDiag(extra){
  const el=document.getElementById('camDiag');
  if(el) el.textContent='진단: '+diagBase+(camCount?(' · 카메라 '+camCount+'대 감지'):'')+(extra||'');
}
function diffThumb(a,b){
  if(!a||!b||a.length!==b.length) return 999;
  let s=0,n=0;
  for(let i=0;i<a.length;i+=4){ s+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]); n+=3; }
  return s/n;
}

/* ================= 자동 촬영 루프 ================= */
const video=document.getElementById('video');
const camStatus=document.getElementById('camStatus');
let loopTimer=null;

function camLabel(){
  const o=document.querySelector('#cfgCam option[value="'+CSS.escape(cfg.cam)+'"]');
  return o?o.textContent:cfg.cam;
}
function camErrText(e){
  const name=(e&&e.name)||'';
  const cam=camLabel();
  if(name==='NotAllowedError') return '카메라 권한이 차단되어 있습니다. 주소창 왼쪽 자물쇠 모양 → 사이트 설정 → 카메라 허용으로 바꾼 뒤 [카메라 다시 시도]를 누르세요. 문서나 채팅 안에서 열었다면 그 화면은 권한을 줄 수 없으니, 크롬(또는 삼성 인터넷) 앱에서 주소를 직접 입력해 여세요.';
  if(name==='NotFoundError'||name==='OverconstrainedError') return cam+'를 찾을 수 없거나 응답하지 않습니다. 설정에서 다른 카메라를 선택해 보세요.';
  if(name==='NotReadableError') return cam+'를 열 수 없습니다. 다른 앱(영상 통화, 카메라, 유튜브 등)이 카메라를 쓰고 있거나 하드웨어 문제일 수 있습니다. 다른 앱을 닫거나 폰을 재시작한 뒤 다시 시도하거나, 설정에서 다른 카메라를 선택해 보세요.';
  if(name==='SecurityError') return '이 화면에서는 카메라가 차단되어 있습니다. 크롬(또는 삼성 인터넷) 앱에서 주소를 직접 입력해 여세요.';
  return cam+' 오류('+(name||e)+'). [카메라 다시 시도]를 누르거나 다른 카메라를 선택해 보세요.';
}
async function startCamera(){
  const retryBtn=document.getElementById('btnCamRetry');
  retryBtn.classList.add('hidden');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    camStatus.innerHTML='<span class="bad">이 화면에서는 카메라를 쓸 수 없습니다(인앱 브라우저). 크롬(또는 삼성 인터넷) 앱을 열고 주소창에 naver323-dev.github.io/studycam 을 직접 입력해 여세요.</span>';
    retryBtn.classList.remove('hidden');
    return;
  }
  try{
    const vc={ width:{ideal:2560}, height:{ideal:1440} };
    if(cfg.cam.indexOf('id:')===0) vc.deviceId={ideal:cfg.cam.slice(3)};
    else vc.facingMode={ideal:cfg.cam};
    stream=await navigator.mediaDevices.getUserMedia({ video:vc, audio:false });
    video.srcObject=stream;
    const tr=stream.getVideoTracks()[0]; const st=tr?tr.getSettings():{};
    diagBase=camLabel()+' · 스트림 켜짐 · '+(st.width||'?')+'x'+(st.height||'?');
    updateDiag();
    camStatus.textContent='교재를 비추면 자동으로 촬영합니다 ('+camLabel()+')';
    loopTimer=setInterval(tick,300);
    listCameras();
  }catch(e){
    diagBase=camLabel()+' · 스트림 꺼짐'; updateDiag(' · '+((e&&e.name)||'오류'));
    camStatus.innerHTML='<span class="bad">'+camErrText(e)+'</span>';
    retryBtn.classList.remove('hidden');
  }
}
function restartCamera(){
  if(loopTimer){ clearInterval(loopTimer); loopTimer=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  startCamera();
}
async function listCameras(){
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cams=devs.filter(d=>d.kind==='videoinput');
    const sel=document.getElementById('cfgCam');
    Array.from(sel.querySelectorAll('option[data-dev]')).forEach(o=>o.remove());
    cams.forEach((c,i)=>{
      const o=document.createElement('option');
      o.value='id:'+c.deviceId; o.dataset.dev='1';
      o.textContent=c.label||('카메라 '+(i+1));
      sel.appendChild(o);
    });
    sel.value=cfg.cam;
    camCount=cams.length; updateDiag();
  }catch(e){}
}
function tick(){
  if(paused||capturing||!video.videoWidth) return;
  const cur=grabThumb(video);
  const luma=meanLuma(cur);
  updateDiag(' · 밝기 '+Math.round(luma));
  if(luma<DARK_LUMA){ stableCount=0; sawTurn=false; camStatus.textContent='화면이 어둡습니다. 책을 밝게 비춰주세요'; lastThumb=cur; return; }
  const d=diffThumb(cur,lastThumb);
  lastThumb=cur;
  const STABLE=6*cfg.sens, TURN=14*cfg.sens;
  if(d>TURN){ sawTurn=true; stableCount=0; camStatus.textContent='넘기는 중…'; return; }
  if(d<STABLE && sawTurn){ stableCount++; }
  else stableCount=0;
  if(stableCount>=3){ stableCount=0; sawTurn=false; capture(); }
}

/* ================= 촬영·분할 ================= */
const cCanvas=document.createElement('canvas'), cCtx=cCanvas.getContext('2d');
async function capture(fromImage){
  if(capturing) return; capturing=true;
  try{
    const srcW = fromImage ? fromImage.width : video.videoWidth;
    const srcH = fromImage ? fromImage.height : video.videoHeight;
    cCanvas.width=srcW; cCanvas.height=srcH;
    cCtx.drawImage(fromImage||video,0,0,srcW,srcH);
    if(!fromImage && meanLuma(grabThumb(cCanvas))<DARK_LUMA){ flash('화면이 너무 어두워 촬영을 건너뛰었습니다', false); return; }
    beep(); flash('촬영 완료. 업로드 중…');
    const parts=splitImage(cCanvas,cfg.mode);
    for(let i=0;i<parts.length;i++){
      pageSeq++; LS.set('seq',pageSeq);
      const item={ pageId:'p'+Date.now()+'_'+pageSeq, order:pageSeq, image:parts[i], retries:0, ts:Date.now() };
      await dbPut(item); updateQueueInfo();
      uploadItem(item); // 백그라운드
    }
  } finally { capturing=false; }
}
function splitImage(canvas,n){
  const cols = n===1?1:2, rows = n===4?2:1;
  const out=[]; const pw=Math.floor(canvas.width/cols), ph=Math.floor(canvas.height/rows);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const pc=document.createElement('canvas'); pc.width=pw; pc.height=ph;
    pc.getContext('2d').drawImage(canvas,c*pw,r*ph,pw,ph,0,0,pw,ph);
    out.push(pc.toDataURL('image/jpeg',0.75).split(',')[1]);
  }
  return out;
}

/* ================= 업로드 ================= */
function updateQueueInfo(){
  dbAll().then(items=>{
    document.getElementById('queueInfo').textContent='대기 '+items.length+'건 · 완료 '+doneCount+'쪽';
    if(items.length>0) warnBeforeUnload(true); else warnBeforeUnload(false);
  });
}
let skipDarkCount=0;
function uploadItem(item){
  if(!cfg.url){ camStatus.innerHTML='<span class="bad">서버 주소를 설정하세요</span>'; return; }
  const img=new Image();
  img.onload=()=>{
    if(meanLuma(grabThumb(img))<DARK_LUMA){
      skipDarkCount++;
      dbDel(item.pageId).then(updateQueueInfo);
      camStatus.textContent='어두운 프레임 '+skipDarkCount+'건을 업로드하지 않고 버렸습니다';
      return;
    }
    fetch(cfg.url,{ method:'POST', mode:'no-cors',
      body: JSON.stringify({token:cfg.token,pageId:item.pageId,pageOrder:item.order,image:item.image}) })
    .catch(()=>{})
    .finally(()=> setTimeout(()=>pollStatus(item,0), 4000));
  };
  img.onerror=()=>{ setTimeout(()=>pollStatus(item,0), 4000); };
  img.src='data:image/jpeg;base64,'+item.image;
}
function pollStatus(item,attempt){
  jsonp(cfg.url,{token:cfg.token,pageId:item.pageId},(res)=>{
    if(res && res.ok && (res.status==='done'||res.status==='suspect')){
      dbDel(item.pageId).then(updateQueueInfo);
      doneCount++;
      if(res.status==='suspect') addReview(item.pageId);
      updateQueueInfo();
      return;
    }
    if(res && res.ok && res.status==='failed'){
      camStatus.innerHTML='<span class="bad">서버 처리 실패: '+item.pageId+'</span>'; return;
    }
    if(attempt<20) setTimeout(()=>pollStatus(item,attempt+1), 8000);
  });
}
let cbSeq=0;
function jsonp(base,params,cb){
  const name='__sc_cb_'+(++cbSeq);
  const q=Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const s=document.createElement('script');
  window[name]=(data)=>{ cb(data); delete window[name]; s.remove(); };
  s.onerror=()=>{ cb(null); delete window[name]; s.remove(); };
  s.src=base+(base.indexOf('?')>=0?'&':'?')+q+'&callback='+name;
  document.head.appendChild(s);
}

/* ================= 검토 목록 ================= */
function addReview(pageId){
  document.getElementById('reviewCard').classList.remove('hidden');
  const li=document.createElement('li'); li.textContent=pageId+' : 인식 불안정, 전자책에서 원본과 대조하세요';
  document.getElementById('reviewList').appendChild(li);
}

/* ================= 종료 경고 ================= */
let warnSet=false;
function warnBeforeUnload(on){
  if(on&&!warnSet){ window.addEventListener('beforeunload',warnFn); warnSet=true; }
  if(!on&&warnSet){ window.removeEventListener('beforeunload',warnFn); warnSet=false; }
}
function warnFn(e){ e.preventDefault(); e.returnValue='업로드 대기 중인 쪽이 있습니다. 나가면 아직 올라가지 않은 쪽은 사라집니다.'; }

/* ================= UI 바인딩 ================= */
document.getElementById('cfgUrl').value=cfg.url;
document.getElementById('cfgToken').value=cfg.token;
document.getElementById('cfgMode').value=String(cfg.mode);
document.getElementById('cfgSound').value=cfg.sound;
document.getElementById('cfgSens').value=String(cfg.sens);
document.getElementById('cfgCam').value=cfg.cam;
document.getElementById('cfgCam').addEventListener('change',e=>{
  cfg.cam=e.target.value; LS.set('cam',cfg.cam);
  if(!TEST) restartCamera();
});
listCameras();

document.getElementById('btnSave').onclick=()=>{
  cfg.url=document.getElementById('cfgUrl').value.trim();
  cfg.token=document.getElementById('cfgToken').value.trim();
  cfg.mode=parseInt(document.getElementById('cfgMode').value,10);
  cfg.sound=document.getElementById('cfgSound').value;
  cfg.sens=parseFloat(document.getElementById('cfgSens').value);
  cfg.cam=document.getElementById('cfgCam').value;
  LS.set('url',cfg.url); LS.set('token',cfg.token); LS.set('mode',cfg.mode);
  LS.set('sound',cfg.sound); LS.set('sens',cfg.sens); LS.set('cam',cfg.cam);
  drawGrid();
  document.getElementById('camCard').classList.remove('hidden');
  if(!TEST && !stream) startCamera();
};
document.getElementById('btnPing').onclick=()=>{
  const url=document.getElementById('cfgUrl').value.trim(), token=document.getElementById('cfgToken').value.trim();
  const el=document.getElementById('pingResult'); el.textContent='확인 중…';
  jsonp(url,{token:token,ping:'1'},(res)=>{
    if(res&&res.ok){ el.innerHTML='<span class="ok">연결됨</span>'; }
    else if(res){ el.innerHTML='<span class="bad">토큰 불일치</span>'; }
    else { el.innerHTML='<span class="bad">주소를 확인하세요</span>'; }
  });
};
document.getElementById('btnCamRetry').onclick=()=>restartCamera();
document.getElementById('btnStop').onclick=(e)=>{
  paused=!paused; e.target.textContent=paused?'다시 시작':'일시정지';
  camStatus.textContent=paused?'일시정지됨':'교재를 비추면 자동으로 촬영합니다';
};
document.getElementById('btnRefresh').onclick=()=>updateQueueInfo();
document.getElementById('btnClearQ').onclick=()=>{
  if(!confirm('업로드 대기 중인 쪽을 모두 버릴까요? 이미 올라간 쪽은 그대로입니다.')) return;
  dbAll().then(items=>Promise.all(items.map(it=>dbDel(it.pageId)))).then(updateQueueInfo);
};

function drawGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  const n=cfg.mode; const cols=n===1?1:2, rows=n===4?2:1;
  let num=1;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const d=document.createElement('div');
    d.style.left=(c*100/cols)+'%'; d.style.top=(r*100/rows)+'%';
    d.style.width=(100/cols)+'%'; d.style.height=(100/rows)+'%';
    d.innerHTML='<span>'+(num++)+'</span>'; g.appendChild(d);
  }
}

/* ================= 테스트 모드 ================= */
if(TEST){
  document.getElementById('btnTestRun').onclick=()=>{
    const f=document.getElementById('testFile').files[0];
    const log=document.getElementById('testLog');
    if(!f){ log.textContent='이미지 파일을 선택하세요'; return; }
    const img=new Image();
    img.onload=()=>{
      capture(img).then(()=>{
        log.textContent='분할·업로드 큐 진입 완료 ('+cfg.mode+'쪽 모드)';
      });
    };
    img.src=URL.createObjectURL(f);
  };
}

/* ================= 시작 ================= */
drawGrid();
dbOpen().then(()=>{
  updateQueueInfo();
  dbAll().then(items=>items.sort((a,b)=>a.order-b.order).forEach(it=>uploadItem(it)));
});
if(cfg.url&&cfg.token&&!TEST){
  document.getElementById('camCard').classList.remove('hidden');
  startCamera();
}
window.addEventListener('online',()=>dbAll().then(items=>items.forEach(it=>uploadItem(it))));
</script>
</body>
</html>
